{% extends 'base.html' %}

{% block content %}
<h2>Payment for {{ course.title }}</h2>
<p>Price: ${{ course.price }}</p>

<form method="post" action="{% url 'payment_view' pk=course.id %}">
    {% csrf_token %}
    {{ form.as_p }}
    <p>Please send payment to: <strong>0693142943</strong></p>
    <button type="submit">Submit Payment</button>
</form>

{% if messages %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endif %}
{% endblock %}
